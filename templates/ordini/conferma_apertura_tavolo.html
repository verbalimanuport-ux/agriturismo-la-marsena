{% extends "base.html" %}
{% block title %}Tavolo {{ tavolo.numero }}{% endblock %}
{% block content %}
<div class="text-center p-5 mx-auto" style="max-width: 480px;">
  <h1 class="mb-3">Tavolo {{ tavolo.numero }}</h1>
  <p class="text-muted mb-4">
    Questo tavolo è libero. Zona: {{ tavolo.zona|default:"—" }} · Capienza: {{ tavolo.capienza }}
  </p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="azione" value="apri_tavolo">
    <button type="submit" class="btn btn-success btn-lg">Apri tavolo</button>
  </form>
  <a href="{% url 'ordini:sala' %}" class="btn btn-link mt-3">&larr; Torna alla sala</a>
</div>
{% endblock %}
