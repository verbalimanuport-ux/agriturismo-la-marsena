<div class="modal fade" id="{{ id_modale }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header" style="background-color: {{ colore }}; color:#fff;">
        <h5 class="modal-title">{{ titolo }}</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body">
        {% if nota_extra %}
          <p class="small mb-3 p-2" style="background-color: var(--color-accent-soft); color: var(--color-accent-dark); border-radius: 8px;">{{ nota_extra }}</p>
        {% endif %}
        {% for categoria, piatti in gruppi %}
          <h6 class="mt-3 mb-2" style="color: var(--color-muted); text-transform:uppercase; letter-spacing:0.05em; font-size:0.85rem;">{{ categoria.nome }}</h6>
          <div class="row g-2 mb-2">
            {% for piatto in piatti %}
              <div class="col-6 col-md-4 col-lg-3">
                <form method="post" class="form-aggiungi-rapido">
                  {% csrf_token %}
                  <input type="hidden" name="azione" value="{{ azione_form }}">
                  <input type="hidden" name="piatto_id" value="{{ piatto.id }}">
                  <button type="submit" class="btn btn-outline-secondary w-100 h-100 py-3" style="border-color: {{ colore }}; text-align:left;">
                    <div class="fw-semibold">{{ piatto.nome }}</div>
                    <div class="small text-muted">&euro;{{ piatto.prezzo }}</div>
                  </button>
                </form>
              </div>
            {% endfor %}
          </div>
        {% empty %}
          <p class="text-muted">Nessun piatto disponibile al momento.</p>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
