<script>
  // Suono di avviso: confronta un numero (es. quanti piatti da preparare, o
  // quanti giri pronti) con quello della volta scorsa su questa stessa
  // pagina. Se è aumentato, suona un "ding" — utile per accorgersi di una
  // novità anche senza guardare lo schermo in quel momento.
  (function () {
    var CHIAVE = "notifica_{{ chiave_notifica }}";
    var valoreAttuale = {{ valore_notifica }};
    var raw = sessionStorage.getItem(CHIAVE);
    var valorePrecedente = raw === null ? null : parseInt(raw, 10);

    if (valorePrecedente !== null && valoreAttuale > valorePrecedente) {
      suonaAvviso();
    }
    sessionStorage.setItem(CHIAVE, valoreAttuale);

    function suonaAvviso() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var t = 0;
        for (var i = 0; i < 3; i++) {
          suonaNota(ctx, 1046, t);
          suonaNota(ctx, 1318, t + 0.16);
          t += 0.42;
        }
      } catch (e) {
        // Niente audio disponibile in questo momento: pazienza, non blocca nulla.
      }
    }

    function suonaNota(ctx, frequenza, ritardo) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      // Onda quadra: più "squillante"/penetrante di una sinusoide morbida,
      // si sente meglio in un ambiente rumoroso come una cucina.
      osc.type = "square";
      var inizio = ctx.currentTime + ritardo;
      osc.frequency.setValueAtTime(frequenza, inizio);
      gain.gain.setValueAtTime(0.0001, inizio);
      gain.gain.exponentialRampToValueAtTime(0.9, inizio + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, inizio + 0.15);
      osc.start(inizio);
      osc.stop(inizio + 0.16);
    }
  })();
</script>
